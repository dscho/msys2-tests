name: main

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - id: matrix
        uses: ./gha-matrix-gen

  build:
    needs: generate-matrix
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix: 
        include: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      FC: ${{ matrix.fc }}
    steps:
      - uses: actions/checkout@v6

      - id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: ${{ matrix.packages }}

      - name: Add staging repo
        shell: msys2 {0}
        run: |
          sed -i '1s|^|[staging]\nServer = https://repo.msys2.org/staging/\nSigLevel = Never\n|' /etc/pacman.conf

      - name: Update using staging
        run: |
          msys2 -c 'pacman --noconfirm -Suuy'
          msys2 -c 'pacman --noconfirm -Suu'

      - name: Download dynamic-base runtime
        uses: actions/download-artifact@v8
        with:
          name: install
          repository: msys2/msys2-runtime
          # https://github.com/msys2/msys2-runtime/pull/381
          run-id: 38147439453
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/msys2-runtime

      - name: Replace MSYS2 runtime DLL
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          Copy-Item -LiteralPath "$env:RUNNER_TEMP/msys2-runtime/usr/bin/msys-2.0.dll" `
            -Destination "$env:MSYS2_LOCATION/usr/bin/msys-2.0.dll" -Force

      - name: Run tests
        uses: ./
